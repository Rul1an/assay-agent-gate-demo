name: lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: shellcheck
        run: shellcheck scripts/*.sh

      # actionlint via `go install` (Go is preinstalled on the runner); the module proxy verifies the
      # pinned version against the Go checksum database, so no third-party action and no curl-to-bash.
      - name: actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.10
          "$(go env GOPATH)/bin/actionlint" -color

      - name: python syntax
        run: python3 -m py_compile tools/mock_github_mcp.py
