name: Agent privileged-action gate

# On every PR: run the agent's actions through the enforcing proxy, project the decisions to SARIF,
# upload them to the Security tab, and fail the PR if any privileged action was denied. The PR is
# RED when an action is not declared, scoped, and approved; GREEN when every action passes.

on:
  pull_request:

permissions:
  contents: read
  security-events: write # required to upload SARIF to the Security tab

concurrency:
  group: agent-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Pinned for a deterministic demo; bump when you want a newer assay. enforcement-sarif ships
  # from v3.26.0 onward.
  ASSAY_VERSION: v3.26.0

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the demo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install assay-mcp-server
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/assay
          gh release download "$ASSAY_VERSION" --repo Rul1an/assay \
            --pattern "assay-mcp-server-$ASSAY_VERSION-x86_64-unknown-linux-gnu.tar.gz" --dir /tmp/assay
          tar -xzf /tmp/assay/*.tar.gz -C /tmp/assay
          BIN="$(find /tmp/assay -type f -name assay-mcp-server | head -1)"
          chmod +x "$BIN"
          echo "ASSAY=$BIN" >> "$GITHUB_ENV"

      - name: Run the agent gate
        run: ./scripts/run-gate.sh enforcement.sarif

      # Fork PRs run with a read-only token, so the Security-tab upload is skipped there; the deny
      # gate above still fails the PR. always() uploads the SARIF even when the gate denies, so the
      # result stays visible in the Security tab.
      - name: Upload SARIF to the Security tab
        if: ${{ always() && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: github/codeql-action/upload-sarif@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4.36.3
        with:
          sarif_file: enforcement.sarif
