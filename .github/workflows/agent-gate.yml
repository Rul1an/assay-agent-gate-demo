name: Agent privileged-action gate

# On every PR: run the agent's actions through the enforcing proxy, project the decisions to SARIF,
# upload them to the Security tab, and fail the PR if any privileged action was denied. The PR is
# RED when an action is not declared, scoped, and approved; GREEN when every action passes.

on:
  pull_request:

permissions:
  contents: read
  security-events: write # required to upload SARIF to the Security tab

concurrency:
  group: agent-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the demo
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # The enforcement-sarif projector is newer than the latest tagged assay release, so build
      # assay-mcp-server from assay main. Swatinem/rust-cache keeps later runs fast.
      - name: Check out assay
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: Rul1an/assay
          ref: main
          path: assay-src

      - name: Cache the Rust build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: assay-src

      - name: Build assay-mcp-server
        working-directory: assay-src
        run: |
          cargo build --release --locked -p assay-mcp-server
          echo "ASSAY=$GITHUB_WORKSPACE/assay-src/target/release/assay-mcp-server" >> "$GITHUB_ENV"

      - name: Run the agent gate
        run: ./scripts/run-gate.sh enforcement.sarif

      # Fork PRs run with a read-only token, so the Security-tab upload is skipped there; the deny
      # gate above still fails the PR. always() uploads the SARIF even when the gate denies, so the
      # result stays visible in the Security tab.
      - name: Upload SARIF to the Security tab
        if: ${{ always() && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: enforcement.sarif
