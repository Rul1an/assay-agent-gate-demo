version: 2
updates:
  # Keep the SHA-pinned GitHub Actions current; Dependabot bumps the pin and updates the version
  # comment, so the supply chain stays both pinned and fresh.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
